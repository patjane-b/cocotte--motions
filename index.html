<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocotte des émotions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      padding: 2rem 1.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 20px; font-weight: 600; color: #2c2c2a; margin-bottom: 0.25rem; }
    .subtitle { font-size: 13px; color: #aaa; margin-bottom: 1.5rem; }

    .instruction {
      font-size: 15px;
      color: #555;
      margin-bottom: 1rem;
      min-height: 24px;
      font-weight: 500;
      transition: color 0.3s;
    }
    .instruction.ready { color: #1D9E75; font-weight: 700; }

    .number-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .num-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid #d3d1c7;
      background: #fff;
      color: #2c2c2a;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .num-btn:hover { background: #f1efe8; }
    .num-btn:active { transform: scale(0.92); }
    .num-btn.selected { background: #E1F5EE; border-color: #1D9E75; color: #0F6E56; font-weight: 700; }
    .num-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Cocotte */
    .cocotte-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 1.25rem;
      cursor: pointer;
      user-select: none;
    }
    .cocotte-svg {
      width: 100%;
      height: 100%;
      transition: transform 0.25s cubic-bezier(.36,.07,.19,.97);
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08));
    }
    .cocotte-wrapper.ready .cocotte-svg {
      filter: drop-shadow(0 4px 16px rgba(29,158,117,0.25));
    }
    .cocotte-wrapper:hover.ready .cocotte-svg {
      transform: scale(1.06);
    }
    .cocotte-pulse {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 3px solid #1D9E75;
      opacity: 0;
      animation: none;
    }
    .cocotte-wrapper.ready .cocotte-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      70% { transform: scale(1.08); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }

    /* Roue */
    .wheel-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 1.25rem;
      display: none;
    }
    .wheel-needle {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 28px solid #D85A30;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
      z-index: 10;
    }
    canvas { border-radius: 50%; display: block; }

    /* Résultat */
    .result-card {
      background: #f8f7f4;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin: 0 auto 1.25rem;
      max-width: 340px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .result-emotion { font-size: 26px; font-weight: 700; color: #2c2c2a; }
    .result-question { font-size: 14px; color: #666; line-height: 1.6; margin: 0; }

    .reset-btn {
      font-size: 13px;
      color: #888;
      background: none;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      padding: 8px 18px;
      cursor: pointer;
      display: none;
    }
    .reset-btn:hover { background: #f1efe8; }

    .chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 0.75rem;
      min-height: 32px;
    }
    .chip {
      background: #E1F5EE;
      color: #0F6E56;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .footer { margin-top: 1.5rem; font-size: 11px; color: #bbb; }
  </style>
</head>
<body>
<div class="app">
  <h1>Cocotte des émotions</h1>
  <p class="subtitle">Choisis deux chiffres, puis tape sur la cocotte !</p>

  <p class="instruction" id="instr">Étape 1 — Choisis un premier chiffre :</p>

  <div class="number-row" id="numrow">
    <button class="num-btn" onclick="pickNumber(1)">1</button>
    <button class="num-btn" onclick="pickNumber(2)">2</button>
    <button class="num-btn" onclick="pickNumber(3)">3</button>
    <button class="num-btn" onclick="pickNumber(4)">4</button>
    <button class="num-btn" onclick="pickNumber(5)">5</button>
    <button class="num-btn" onclick="pickNumber(6)">6</button>
    <button class="num-btn" onclick="pickNumber(7)">7</button>
    <button class="num-btn" onclick="pickNumber(8)">8</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="cocotte-wrapper" id="cocotteWrapper" onclick="launchWheel()">
    <div class="cocotte-pulse"></div>
    <svg class="cocotte-svg" id="cocssvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <polygon points="100,8 192,100 100,192 8,100" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
      <polygon points="100,8 146,54 100,100 54,54" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
      <polygon points="146,54 192,100 146,146 100,100" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
      <polygon points="100,100 146,146 100,192 54,146" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
      <polygon points="54,146 100,100 54,54 8,100" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
      <line x1="100" y1="8" x2="100" y2="192" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <line x1="8" y1="100" x2="192" y2="100" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <circle cx="100" cy="100" r="18" fill="#fff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
      <text x="100" y="105" text-anchor="middle" font-size="18" font-family="sans-serif">🎡</text>
    </svg>
  </div>

  <div class="wheel-wrapper" id="wheelWrap">
    <div class="wheel-needle"></div>
    <canvas id="wheelCanvas" width="280" height="280"></canvas>
  </div>

  <div class="result-card" id="resultCard">
    <span class="result-emotion" id="resultEmotion"></span>
    <p class="result-question" id="resultQuestion"></p>
  </div>

  <button class="reset-btn" id="resetBtn" onclick="reset()">↩ Recommencer</button>

  <p class="footer">patriciapsy.fr</p>
</div>

<script>
const emotions = [
  { mot: "Inquiète",   question: "Est-ce qu'il y a quelque chose qui t'inquiète en ce moment ?",                        color: "#F5C4B3" },
  { mot: "Fière",      question: "De quoi tu es fière cette semaine, même d'une petite chose ?",                        color: "#9FE1CB" },
  { mot: "Débordée",   question: "Qu'est-ce qui te donne l'impression d'avoir trop à gérer ?",                          color: "#AFA9EC" },
  { mot: "Joyeuse",    question: "Qu'est-ce qui t'a rendue joyeuse récemment ?",                                        color: "#C0DD97" },
  { mot: "Incomprise", question: "Est-ce qu'il y a des moments où tu te sens incomprise ?",                             color: "#F4C0D1" },
  { mot: "Soulagée",   question: "Y a-t-il quelque chose dont tu t'es sentie soulagée dernièrement ?",                  color: "#FAC775" },
  { mot: "En colère",  question: "Qu'est-ce qui peut te mettre en colère ? Comment ça se passe dans ton corps ?",       color: "#F7C1C1" },
  { mot: "Triste",     question: "Est-ce que tu peux me parler d'un moment où tu t'es sentie triste ?",                color: "#B5D4F4" }
];

let step = 0, firstNum = 0, targetIdx = -1, spinning = false, ready = false;

function pickNumber(n) {
  if (spinning || ready) return;
  const btns = document.querySelectorAll('.num-btn');

  if (step === 0) {
    firstNum = n;
    step = 1;
    btns.forEach((b,i) => { b.classList.toggle('selected', i+1 === n); });
    document.getElementById('instr').textContent = 'Étape 2 — Choisis un deuxième chiffre :';
    updateChips(n, null);
  } else {
    targetIdx = (firstNum + n) % 8;
    btns.forEach((b,i) => {
      if (i+1 !== firstNum) b.classList.toggle('selected', i+1 === n);
    });
    updateChips(firstNum, n);
    // Désactiver boutons
    btns.forEach(b => b.disabled = true);
    // Activer cocotte
    ready = true;
    document.getElementById('cocotteWrapper').classList.add('ready');
    document.getElementById('instr').textContent = '🎡 Tape sur la cocotte pour lancer !';
    document.getElementById('instr').classList.add('ready');
  }
}

function updateChips(n1, n2) {
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  if (n1) { const c=document.createElement('div'); c.className='chip'; c.textContent=n1; chips.appendChild(c); }
  if (n2) { const c=document.createElement('div'); c.className='chip'; c.textContent=n2; chips.appendChild(c); }
}

function launchWheel() {
  if (!ready || spinning) return;
  ready = false;
  spinning = true;

  document.getElementById('cocotteWrapper').classList.remove('ready');
  document.getElementById('instr').textContent = 'La roue tourne...';
  document.getElementById('instr').classList.remove('ready');

  // Bounce cocotte
  const svg = document.getElementById('cocssvg');
  svg.style.transform = 'scale(0.85) rotate(-10deg)';
  setTimeout(() => svg.style.transform = 'scale(1) rotate(0deg)', 250);

  // Afficher roue
  setTimeout(() => {
    document.getElementById('cocotteWrapper').style.display = 'none';
    document.getElementById('numrow').style.display = 'none';
    document.getElementById('chips').style.display = 'none';
    document.getElementById('wheelWrap').style.display = 'block';
    spinWheel(targetIdx);
  }, 400);
}

function drawWheel(angle) {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 140, cy = 140, r = 128;
  const slice = (2 * Math.PI) / 8;
  ctx.clearRect(0, 0, 280, 280);
  emotions.forEach((e, i) => {
    const start = angle + i * slice;
    const end = start + slice;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = e.color; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#333';
    ctx.font = '600 13px -apple-system, sans-serif';
    ctx.fillText(e.mot, r - 12, 5);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 2*Math.PI);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1; ctx.stroke();
}

function spinWheel(idx) {
  const slice = (2 * Math.PI) / 8;
  const needleAngle = -Math.PI / 2;
  const targetAngle = needleAngle - (idx * slice + slice / 2);
  const extraSpins = 5 * 2 * Math.PI;
  const finalAngle = targetAngle - extraSpins;
  const duration = 3500;
  const start = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const t = Math.min((now - start) / duration, 1);
    drawWheel(finalAngle * easeOut(t));
    if (t < 1) { requestAnimationFrame(animate); }
    else { spinning = false; setTimeout(() => showResult(idx), 500); }
  }
  drawWheel(0);
  requestAnimationFrame(animate);
}

function showResult(idx) {
  const e = emotions[idx];
  document.getElementById('resultEmotion').textContent = e.mot;
  document.getElementById('resultQuestion').textContent = e.question;
  document.getElementById('resultCard').style.display = 'flex';
  document.getElementById('resetBtn').style.display = 'inline-block';
  document.getElementById('instr').textContent = '';
}

function reset() {
  step = 0; firstNum = 0; targetIdx = -1; spinning = false; ready = false;
  document.getElementById('instr').textContent = 'Étape 1 — Choisis un premier chiffre :';
  document.getElementById('instr').classList.remove('ready');
  document.getElementById('numrow').style.display = 'flex';
  document.getElementById('chips').style.display = 'flex';
  document.getElementById('chips').innerHTML = '';
  document.getElementById('cocotteWrapper').style.display = 'block';
  document.getElementById('cocotteWrapper').classList.remove('ready');
  document.getElementById('wheelWrap').style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  document.querySelectorAll('.num-btn').forEach(b => { b.disabled = false; b.classList.remove('selected'); });
  const ctx = document.getElementById('wheelCanvas').getContext('2d');
  ctx.clearRect(0, 0, 280, 280);
  document.getElementById('cocssvg').style.transform = '';
}
</script>
</body>
</html>
