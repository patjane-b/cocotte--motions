<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocotte des émotions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      padding: 2rem 1.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #2c2c2a;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 1.5rem;
    }
    .cocotte-visual {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 1.25rem;
      cursor: pointer;
      user-select: none;
    }
    .cocotte-svg {
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
    }
    .instruction {
      font-size: 15px;
      color: #555;
      margin-bottom: 1rem;
      min-height: 22px;
    }
    .number-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .num-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid #d3d1c7;
      background: #fff;
      color: #2c2c2a;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    .num-btn:hover { background: #f1efe8; }
    .num-btn:active { transform: scale(0.92); }
    .num-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .counter-display {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 0.75rem;
      min-height: 20px;
    }
    .wheel-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 1.25rem;
      display: none;
    }
    .wheel-needle {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 26px solid #D85A30;
      z-index: 10;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25));
    }
    canvas { border-radius: 50%; display: block; }
    .result-card {
      background: #f8f7f4;
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin: 0 auto 1rem;
      max-width: 340px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .result-emotion {
      font-size: 26px;
      font-weight: 600;
      color: #2c2c2a;
    }
    .result-question {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    .reset-btn {
      font-size: 13px;
      color: #666;
      background: none;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      padding: 8px 18px;
      cursor: pointer;
      display: none;
      margin-top: 4px;
    }
    .reset-btn:hover { background: #f1efe8; }
    .footer {
      margin-top: 1.5rem;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Cocotte des émotions</h1>
  <p class="subtitle">Un outil pour explorer ce qu'on ressent</p>

  <div class="cocotte-visual" onclick="bounceCocotte()">
    <svg class="cocotte-svg" id="cocssvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <polygon points="100,8 192,100 100,192 8,100" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
      <polygon points="100,8 146,54 100,100 54,54" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
      <polygon points="146,54 192,100 146,146 100,100" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
      <polygon points="100,100 146,146 100,192 54,146" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
      <polygon points="54,146 100,100 54,54 8,100" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
      <line x1="100" y1="8" x2="100" y2="192" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <line x1="8" y1="100" x2="192" y2="100" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <circle cx="100" cy="100" r="16" fill="#fff" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <text x="100" y="104" text-anchor="middle" font-size="9" fill="#aaa" font-family="sans-serif">taper</text>
    </svg>
  </div>

  <p class="instruction" id="instr">Choisis un premier chiffre :</p>

  <div class="number-row" id="numrow">
    <button class="num-btn" onclick="pickNumber(1)">1</button>
    <button class="num-btn" onclick="pickNumber(2)">2</button>
    <button class="num-btn" onclick="pickNumber(3)">3</button>
    <button class="num-btn" onclick="pickNumber(4)">4</button>
    <button class="num-btn" onclick="pickNumber(5)">5</button>
    <button class="num-btn" onclick="pickNumber(6)">6</button>
    <button class="num-btn" onclick="pickNumber(7)">7</button>
    <button class="num-btn" onclick="pickNumber(8)">8</button>
  </div>

  <div class="counter-display" id="counter"></div>

  <div class="wheel-wrapper" id="wheelWrap">
    <div class="wheel-needle"></div>
    <canvas id="wheelCanvas" width="280" height="280"></canvas>
  </div>

  <div class="result-card" id="resultCard">
    <span class="result-emotion" id="resultEmotion"></span>
    <p class="result-question" id="resultQuestion"></p>
  </div>

  <button class="reset-btn" id="resetBtn" onclick="reset()">&#8635; Recommencer</button>

  <p class="footer">patriciapsy.fr</p>
</div>

<script>
const emotions = [
  { mot: "Inquiète",    question: "Est-ce qu'il y a quelque chose qui t'inquiète en ce moment ?",                        color: "#F5C4B3" },
  { mot: "Fière",       question: "De quoi tu es fière cette semaine, même d'une petite chose ?",                        color: "#9FE1CB" },
  { mot: "Débordée",    question: "Qu'est-ce qui te donne l'impression d'avoir trop à gérer ?",                          color: "#AFA9EC" },
  { mot: "Joyeuse",     question: "Qu'est-ce qui t'a rendue joyeuse récemment ?",                                        color: "#C0DD97" },
  { mot: "Incomprise",  question: "Est-ce qu'il y a des moments où tu te sens incomprise ?",                             color: "#F4C0D1" },
  { mot: "Soulagée",    question: "Y a-t-il quelque chose dont tu t'es sentie soulagée dernièrement ?",                  color: "#FAC775" },
  { mot: "En colère",   question: "Qu'est-ce qui peut te mettre en colère ? Comment ça se passe dans ton corps ?",       color: "#F7C1C1" },
  { mot: "Triste",      question: "Est-ce que tu peux me parler d'un moment où tu t'es sentie triste ?",                color: "#B5D4F4" }
];

let step = 0, firstNum = 0, spinning = false;

function bounceCocotte() {
  const s = document.getElementById('cocssvg');
  s.style.transform = 'scale(0.92) rotate(-6deg)';
  setTimeout(() => s.style.transform = 'scale(1) rotate(0deg)', 200);
}

function pickNumber(n) {
  if (spinning) return;
  if (step === 0) {
    firstNum = n;
    step = 1;
    document.getElementById('counter').textContent = 'Maintenant choisis un deuxième chiffre :';
    document.getElementById('instr').textContent = '';
    bounceCocotte();
  } else {
    const idx = (firstNum + n) % 8;
    step = 0;
    document.getElementById('counter').textContent = '';
    document.getElementById('instr').textContent = '';
    document.getElementById('numrow').style.display = 'none';
    spinWheel(idx);
  }
}

function drawWheel(rotationAngle) {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 140, cy = 140, r = 128;
  const slice = (2 * Math.PI) / 8;
  ctx.clearRect(0, 0, 280, 280);
  emotions.forEach((e, i) => {
    const start = rotationAngle + i * slice;
    const end = start + slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#333';
    ctx.font = '500 12px -apple-system, sans-serif';
    ctx.fillText(e.mot, r - 12, 5);
    ctx.restore();
  });
  ctx.beginPath();
  ctx.arc(cx, cy, 20, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function spinWheel(targetIdx) {
  spinning = true;
  const wrap = document.getElementById('wheelWrap');
  wrap.style.display = 'block';
  const slice = (2 * Math.PI) / 8;
  const needleAngle = -Math.PI / 2;
  const targetAngle = needleAngle - (targetIdx * slice + slice / 2);
  const extraSpins = 5 * 2 * Math.PI;
  const finalAngle = targetAngle - extraSpins;
  const duration = 3500;
  const start = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const currentAngle = finalAngle * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      setTimeout(() => showResult(targetIdx), 500);
    }
  }

  drawWheel(0);
  requestAnimationFrame(animate);
}

function showResult(idx) {
  const e = emotions[idx];
  document.getElementById('resultEmotion').textContent = e.mot;
  document.getElementById('resultQuestion').textContent = e.question;
  const card = document.getElementById('resultCard');
  card.style.display = 'flex';
  document.getElementById('resetBtn').style.display = 'inline-block';
}

function reset() {
  step = 0; firstNum = 0; spinning = false;
  document.getElementById('instr').textContent = 'Choisis un premier chiffre :';
  document.getElementById('numrow').style.display = 'flex';
  document.getElementById('counter').textContent = '';
  document.getElementById('wheelWrap').style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  const ctx = document.getElementById('wheelCanvas').getContext('2d');
  ctx.clearRect(0, 0, 280, 280);
}
</script>
</body>
</html>
